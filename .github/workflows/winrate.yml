name: Win-rate replay
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/winrate.yml"
      - "evaluate_signals.py"
      - "evaluate_strategies.py"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q yfinance numpy pandas
      - name: Run historical replay
        run: python evaluate_signals.py
      - name: Run per-market strategy selection (train/test split)
        run: python evaluate_strategies.py
