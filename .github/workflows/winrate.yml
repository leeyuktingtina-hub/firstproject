name: Win-rate replay
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/winrate.yml"
      - "evaluate_signals.py"
      - "evaluate_strategies.py"
      - "evaluate_longterm.py"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q yfinance numpy pandas
      - name: Run long-term replay 1995-today
        run: python evaluate_longterm.py
